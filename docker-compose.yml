services:
  backend:
    build: ./backend
    container_name: hackathon-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:5001:5001"
    env_file:
      - ./backend/.env
    networks:
      - shared-network

  frontend:
    build: ./frontend
    container_name: hackathon-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    networks:
      - shared-network

networks:
  shared-network:
    external: true